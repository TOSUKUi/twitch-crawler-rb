openapi: 3.0.0
info:
  title: Stream Analytics API
  version: 1.0.0
  description: Stream and chat analytics API for analyzing streaming data

servers:
  - url: http://localhost:8080/api/v1
    description: Development server

tags:
  - name: analytics
    description: Stream analytics endpoints
  - name: metrics
    description: Streaming metrics endpoints

paths:
  /streams:
    get:
      tags:
        - streams
      summary: List all streams
      operationId: listStreams
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stream'

  /streams/{streamId}:
    get:
      tags:
        - streams
      summary: Get stream details
      operationId: getStreamDetails
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
  /streams/{streamId}/analytics:
    get:
      tags:
        - analytics
      summary: Get stream analytics
      operationId: getStreamAnalytics
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: start_date
          in: query
          description: Analysis start date
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Analysis end date
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamAnalytics'

  /streams/{streamId}/metrics:
    get:
      tags:
        - metrics
      summary: Get stream metrics
      operationId: getStreamMetrics
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: interval
          in: query
          description: Time interval for metrics aggregation
          schema:
            type: string
            enum: [minute, hour, day]
            default: hour
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamMetrics'

components:
  schemas:
    StreamAnalytics:
      type: object
      properties:
        stream_id:
          type: integer
          format: int64
        engagement_rate:
          type: number
          format: float
        chat_density:
          type: number
          format: float
        returning_chatters_ratio:
          type: number
          format: float
        moderator_activity:
          type: object
          properties:
            message_count:
              type: integer
            influence_score:
              type: number
              format: float

    StreamMetrics:
      type: object
      properties:
        stream_id:
          type: integer
          format: int64
        time_series:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              viewer_count:
                type: integer
              chat_count:
                type: integer
              sentiment_score:
                type: number
                format: float
              chat_timeseries:
                type: array
                items:
                  type: object
                  properties:
                    ts:
                      type: string
                      format: date-time
                    neutral:
                      type: integer
                    positive:
                      type: integer
                    negative:
                      type: integer
                    id:
                      type: string
                      nullable: true
    Stream:
      type: object
      properties:
        id:
          type: integer
          format: int64
        game_id:
          type: integer
          format: int64
        game_name:
          type: string
        is_mature:
          type: boolean
        status:
          type: string
        language:
          type: string
        chats_subscribed:
          type: boolean
        chats_subscribed_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        thumbnail_url:
          type: string
        title:
          type: string
        data_type:
          type: string
        user_id:
          type: integer
          format: int64
        user_login:
          type: string
        user_name:
          type: string
        max_viewer:
          type: integer
        viewer_count:
          type: integer
        tag_ids:
          type: array
          items:
            type: string
          nullable: true
        tags:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        video_id:
          type: string
        video_thumbnail_url:
          type: string
        video_url:
          type: string
        video_view_count:
          type: integer
        video_duration:
          type: integer
        video_created_at:
          type: string
          format: date-time
        video_published_at:
          type: string
          format: date-time
